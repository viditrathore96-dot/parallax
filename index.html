<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vidit Rathore — 3D Parallax Experience</title>
    <meta
      name="description"
      content="Immersive multi-layered 3D nature parallax web experience featuring mountain monoliths, atmospheric fog, cursor-driven depth physics, and GSAP 3 choreography."
    />
    <meta property="og:title" content="Vidit Rathore — 3D Parallax Experience" />
    <meta
      property="og:description"
      content="Immersive multi-layered 3D nature parallax web experience featuring mountain monoliths, atmospheric fog, cursor-driven depth physics, and GSAP 3 choreography."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Poppins (100, 300, 400, 800) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;300;400;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome v6 CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header class="hide">
      <nav aria-label="Primary Navigation">
        <a href="#home" class="brand-link" aria-label="Travelo Home">
          <img
            src="/assets/aistudio/logo_e9c6ca8c.png"
            alt="Travelo"
            class="logo"
            referrerpolicy="no-referrer"
          />
        </a>
        <ul>
          <li>
            <a href="#home" id="nav-home">Home</a>
          </li>
          <li>
            <a href="#explore" id="nav-explore">Explore</a>
          </li>
          <li class="search">
            <a
              href="#search"
              id="nav-search"
              aria-label="Search destinations"
              aria-expanded="false"
              aria-controls="search-overlay"
            >
              <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            </a>
          </li>
          <li class="hamburger">
            <a
              href="#menu"
              id="nav-hamburger"
              aria-label="Toggle navigation menu"
              aria-expanded="false"
              aria-controls="menu-drawer"
            >
              <div class="bar"></div>
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main id="parallax-stage" data-testid="parallax-stage">
      <div class="vignette hide" aria-hidden="true"></div>

      <!-- Layer 1: Background Panorama -->
      <img
        src="/assets/aistudio/background_bfb8ca25.png"
        alt="Panoramic misty mountain range"
        data-speed-x="0.3"
        data-speed-y="0.3"
        data-speed-z="0"
        data-rotation="0"
        data-distance="-200"
        class="parallax bg-img"
        referrerpolicy="no-referrer"
      />

      <!-- Layer 2: Distant Atmospheric Fog -->
      <img
        src="/assets/aistudio/fog_7_c878e14d.png"
        alt=""
        aria-hidden="true"
        data-speed-x="0.27"
        data-speed-y="0.27"
        data-speed-z="0"
        data-rotation="0"
        data-distance="850"
        class="parallax fog-7"
        referrerpolicy="no-referrer"
      />

      <!-- Layer 3: Mountain 10 (Far Background Monolith) -->

        aria-hidden="true"

        data-rotation="0.2"
        data-distance="3800"

      <!-- Static Environment Overlays (No Parallax Class) -->
      <img
        src="/assets/aistudio/sun_rays_4f48c5b5.png"
        alt=""
        aria-hidden="true"
        class="sun-rays hide"
        referrerpolicy="no-referrer"
      />
      <img

        alt=""

      />

      <!-- Foreground Atmospheric Fog 1 -->
      <img
        src="/assets/aistudio/fog_1_aa8ace86.png"
        alt=""
        aria-hidden="true"
        data-speed-x="0.12"
        data-speed-y="0.12"
        data-speed-z="0"
        data-rotation="0"
        data-distance="4100"
        class="parallax fog-1"
        referrerpolicy="no-referrer"
      />
    </main>

    <!-- Interactive Search Overlay (hidden until triggered) -->
    <section
      id="search-overlay"
      class="scene-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="search-dialog-title"
      aria-hidden="true"
      hidden
    >
      <div class="overlay-card">
        <div class="overlay-header">
          <h3 id="search-dialog-title">Search Vistas &amp; Peaks</h3>
          <button type="button" class="overlay-close" data-close-overlay aria-label="Close search">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <div class="search-field">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <label for="vista-search-input" class="sr-only">Filter mountain vistas</label>
          <input
            id="vista-search-input"
            type="search"
            placeholder="Filter peaks (e.g. Tianzi, Mist, Canopy)..."
            autocomplete="off"
          />
        </div>
        <ul id="vista-results" class="vista-list"></ul>
      </div>
    </section>

    <!-- Interactive Explore / Menu Drawer (hidden until triggered) -->
    <aside
      id="menu-drawer"
      class="scene-drawer"
      role="dialog"
      aria-modal="true"
      aria-labelledby="drawer-title"
      aria-hidden="true"
      hidden
    >
      <div class="drawer-header">
        <h3 id="drawer-title">Scenic Viewpoints</h3>
        <button type="button" class="overlay-close" data-close-overlay aria-label="Close menu">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <p class="drawer-subtitle">
        Shift the 3D parallax camera to inspect depth planes across the mountain monoliths.
      </p>
      <div class="drawer-actions">
        <button type="button" class="drawer-btn" data-preset="center">Center Horizon</button>
        <button type="button" class="drawer-btn" data-preset="left-ridge">West Ridge</button>
        <button type="button" class="drawer-btn" data-preset="right-ridge">East Sunbeams</button>
        <button type="button" class="drawer-btn" data-preset="canopy">Deep Canopy</button>
        <button type="button" class="drawer-btn" id="replay-intro-btn">Replay Entrance</button>
      </div>
    </aside>

    <!-- GSAP 3 Core CDN -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
